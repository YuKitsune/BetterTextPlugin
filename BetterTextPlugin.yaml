# BetterTextPlugin configuration
#
# Templates are used by the composer to suggest messages for text-only pilots.
# Each template has:
#   Content - the message text, with $PARAM placeholders for variable fields
#   Tags    - keywords used for fuzzy search
#
# Parameters use $UPPERCASE format. The following are auto-resolved from flight data:
#   $CALLSIGN  - aircraft callsign
#   $CFL       - cleared flight level
#   $ASSR    - assigned squawk code
#   $DEP       - departure airport
#   $DEST      - destination airport
#   $RWY       - departure runway
#   $SID       - assigned SID
#   $STAR      - assigned STAR
#   $ROUTE     - flight planned route
#   $TYPE      - aircraft type
#
# All other parameters require manual entry via the composer.

Templates:

  # ---------------------------------------------------------------------------
